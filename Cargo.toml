[package]
name = "minitask"
version = "0.1.2"
edition = "2021"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
serde_json = "1.0"
tokio = { version = "1.0", features = ["io-std", "io-util", "macros", "rt", "rt-multi-thread", "sync"] }
async-trait = "0.1"
rust-mcp-sdk = { version = "0.9", features = ["server", "stdio"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[lib]
name = "minitask"
path = "src/lib.rs"

[[bin]]
name = "minitask"
path = "src/main.rs"

[dev-dependencies]
tempfile = "3.8"

[[test]]
name = "unit"
path = "tests/unit/mod.rs"

[[test]]
name = "integration"
path = "tests/integration/mod.rs"